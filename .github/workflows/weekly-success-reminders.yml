name: Weekly Success Review Reminders

on:
  schedule:
    # Weekdays at 9:00 AM America/New_York (13:00 UTC, or 14:00 UTC during DST)
    # Using 13:00 UTC as a safe default (covers both EST and EDT).
    # The job itself only sends on the week's first business day, so a holiday
    # Monday defers the weekly send to Tuesday instead of losing the week.
    - cron: '0 13 * * 1-5'
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly success review reminders
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          BASE_URL="${BASE_URL:-https://cleargo.netlify.app}"
          if [ -z "$BASE_URL" ]; then
            echo "APP_BASE_URL secret not set" >&2
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET secret not set" >&2
            exit 1
          fi
          echo "Triggering weekly success review reminders..."
          for i in 1 2 3; do
            STATUS=$(curl -sS -o response.json -w "%{http_code}" \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$BASE_URL/api/jobs/weekly-success-reminders") || true
            echo "HTTP $STATUS"
            cat response.json || true
            if [ "$STATUS" = "200" ]; then 
              echo "Success review reminders sent successfully"
              exit 0
            fi
            echo "Retry $i..."; sleep 10
          done
          echo "Failed after retries" >&2
          exit 1
