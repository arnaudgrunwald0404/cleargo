name: Supabase Migrations

# Merging to main applies migrations to DEVELOPMENT only.
#
# Production is deliberately NOT on the push trigger. Applying to production
# requires manually running this workflow with target=production and typing the
# confirmation phrase. The `environment: production` below is a second gate that
# currently does nothing -- the repo has no environments and creating one needs
# admin rights, which we do not have. If a repo admin later creates a
# "production" environment with required reviewers, that gate activates on its own.
on:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/**
  workflow_dispatch:
    inputs:
      target:
        description: Which database to apply migrations to
        type: choice
        options:
          - development
          - production
        default: development
      confirm:
        description: 'For production only: type  apply to production'
        type: string
        default: ''

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  development:
    name: Apply to development
    if: github.event_name == 'push' || github.event.inputs.target == 'development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Connect with an explicit pooler connection string rather than `supabase
      # link`. link calls the Management API, which needs a personal access token
      # with privileges in the project's organisation -- and development and
      # production live in DIFFERENT Supabase orgs, so no single token covers both.
      # --db-url talks only to Postgres: no Management API, no org membership, and
      # the pooler host is IPv4 (runners have no IPv6).
      # A missing secret expands to an empty string with no warning, and the CLI
      # then falls back to a local socket and fails with a confusing
      # "host=/var/run/postgresql user=runner" error that looks like a network
      # problem. Fail loudly and specifically instead.
      - name: Check connection string is set
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::${SECRET_NAME} is empty or not set. Add it as a repository secret using the Session pooler string (port 5432)."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *pooler.supabase.com*) ;;
            *) echo "::error::${SECRET_NAME} is not a pooler host. GitHub runners have no IPv6, so the direct db.<ref>.supabase.co endpoint cannot work. Use the Session pooler string (port 5432)." ; exit 1 ;;
          esac
        env:
          SUPABASE_DB_URL: ${{ secrets.CLEARGO_DATABASE_URL_DEV }}
          SECRET_NAME: CLEARGO_DATABASE_URL_DEV

      - name: Show pending migrations
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.CLEARGO_DATABASE_URL_DEV }}

      # --include-all is load bearing: migration history predates this workflow and
      # has gaps, so pending files can sort BELOW the newest recorded version and
      # would otherwise be skipped in silence. --yes because there is no TTY.
      - name: Push migrations
        run: supabase db push --include-all --yes --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.CLEARGO_DATABASE_URL_DEV }}

  production:
    name: Apply to production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require typed confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "apply to production" ]; then
            echo "::error::Refusing to touch production. Re-run with confirm set to exactly: apply to production"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # See the note in the development job: --db-url avoids the Management API.
      # A missing secret expands to an empty string with no warning, and the CLI
      # then falls back to a local socket and fails with a confusing
      # "host=/var/run/postgresql user=runner" error that looks like a network
      # problem. Fail loudly and specifically instead.
      - name: Check connection string is set
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::${SECRET_NAME} is empty or not set. Add it as a repository secret using the Session pooler string (port 5432)."
            exit 1
          fi
          case "$SUPABASE_DB_URL" in
            *pooler.supabase.com*) ;;
            *) echo "::error::${SECRET_NAME} is not a pooler host. GitHub runners have no IPv6, so the direct db.<ref>.supabase.co endpoint cannot work. Use the Session pooler string (port 5432)." ; exit 1 ;;
          esac
        env:
          SUPABASE_DB_URL: ${{ secrets.CLEARGO_DATABASE_URL }}
          SECRET_NAME: CLEARGO_DATABASE_URL

      - name: Show pending migrations
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.CLEARGO_DATABASE_URL }}

      # Prints the exact statements that would run against live production data
      # before anything is applied. Read this step before trusting the next one.
      - name: Dry run
        run: supabase db push --include-all --dry-run --yes --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.CLEARGO_DATABASE_URL }}

      - name: Push migrations
        run: supabase db push --include-all --yes --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.CLEARGO_DATABASE_URL }}
