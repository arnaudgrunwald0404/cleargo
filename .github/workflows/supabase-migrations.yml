name: Supabase Migrations

# Merging to main applies migrations to DEVELOPMENT only.
#
# Production is deliberately NOT on the push trigger. Applying to production
# requires manually running this workflow with target=production and typing the
# confirmation phrase. The `environment: production` below is a second gate that
# currently does nothing -- the repo has no environments and creating one needs
# admin rights, which we do not have. If a repo admin later creates a
# "production" environment with required reviewers, that gate activates on its
# own with no change here.
on:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/**
  workflow_dispatch:
    inputs:
      target:
        description: Which database to apply migrations to
        type: choice
        options:
          - development
          - production
        default: development
      confirm:
        description: 'For production only: type  apply to production'
        type: string
        default: ''

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  development:
    name: Apply to development
    if: github.event_name == 'push' || github.event.inputs.target == 'development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --include-all is load bearing: migration history predates this workflow
      # and has gaps, so pending files sort BELOW the newest recorded version
      # and would otherwise be skipped in silence.
      - name: Show pending migrations
        run: supabase migration list --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_DEV }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}

      - name: Push migrations
        run: supabase db push --include-all --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_DEV }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_DEV }}

  production:
    name: Apply to production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Require typed confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "apply to production" ]; then
            echo "::error::Refusing to touch production. Re-run with confirm set to exactly: apply to production"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Review this list before the push step runs. These migrations carry DML
      # against live production rows, not just DDL.
      - name: Show pending migrations
        run: supabase migration list --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}

      - name: Push migrations
        run: supabase db push --include-all --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID_PROD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD_PROD }}
