# Reference manifest for the ClearGO Slack app.
#
# Points at the production site. Change the host if the site moves to a custom
# domain. Paste into Slack: Your Apps > the app > Features > App Manifest.
#
# Every url and request_url below corresponds to a route that exists in this
# repo. Do not add a command here before its route exists: a declared command
# with no handler returns 404 and Slack shows the user a dispatch error.
display_information:
  name: ClearGO
  description: Product release readiness tracking, ownership, and collaboration
  background_color: "#697771"

features:
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: ClearGO
    always_online: true
  # Required for the link_shared event to fire at all. The handler
  # (handleLinkShared in api/integrations/slack/events) is reachable only for
  # domains listed here; without them Slack never sends the event.
  unfurl_domains:
    - cleargo.netlify.app
  # NOTE: these commands operate on RELEASES (the `epic` table), not launches.
  # Releases and launches are different objects in ClearGO — the launch side
  # (`launch`, `launch_criterion_status`, `launch_artifact`) has no commands yet.
  slash_commands:
    - command: /release-status
      url: https://cleargo.netlify.app/api/integrations/slack/commands/release-status
      description: Get the current status of a release
      usage_hint: "[release-name or aha-id]"
      should_escape: false
    - command: /my-releases
      url: https://cleargo.netlify.app/api/integrations/slack/commands/my-releases
      description: View releases you own or are involved with
      usage_hint: ""
      should_escape: false
    - command: /who-is-blocking
      url: https://cleargo.netlify.app/api/integrations/slack/commands/who-is-blocking
      description: Rank people by unreviewed criteria on active releases
      usage_hint: "[TIER_1 | TIER_2 | TIER_3]"
      should_escape: false

oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:read
      - channels:manage
      - chat:write
      - chat:write.customize
      - chat:write.public
      - commands
      - files:write
      - groups:read
      - im:history
      - im:read
      - im:write
      - links:read
      - links:write
      # Required by SlackClient.openMultiUserConversation, which
      # src/lib/slack/notifications.ts uses for group DMs. With mpim:read alone,
      # conversations.open fails with missing_scope.
      - mpim:read
      - mpim:write
      - reactions:write
      - users:read
      - users:read.email

settings:
  event_subscriptions:
    request_url: https://cleargo.netlify.app/api/integrations/slack/events
    bot_events:
      - app_home_opened
      - app_mention
      - link_shared
      - message.im
  interactivity:
    is_enabled: true
    request_url: https://cleargo.netlify.app/api/integrations/slack/interactions
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
